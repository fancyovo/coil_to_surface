<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="470" viewBox="0 0 1320 470">
  <defs>
    <style>
      .title{font:700 22px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172832}
      .panel{font:700 18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172832}
      .body{font:400 15px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#344954}
      .small{font:400 13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#5d6c75}
      .axis{stroke:#263f50;stroke-width:1.3}
      .contour{fill:none;stroke:#4f8584;stroke-width:1.7}
      .line{fill:none;stroke:#c36f35;stroke-width:2}
      .guide{fill:none;stroke:#a6b2b9;stroke-width:1;stroke-dasharray:4 4}
    </style>
    <linearGradient id="confidence" x1="0" x2="1">
      <stop offset="0" stop-color="#4f8584" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c36f35" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="1320" height="470" fill="#fff"/>
  <text x="50" y="42" class="title">磁轴邻域中的几何标签、物理磁通与直场线坐标</text>
  <line x1="50" y1="58" x2="1270" y2="58" stroke="#cbd3d8"/>
  <text x="55" y="92" class="panel">(a) 截面上的几何标签 s</text>
  <line x1="95" y1="350" x2="405" y2="350" class="axis"/>
  <line x1="250" y1="390" x2="250" y2="120" class="axis"/>
  <text x="411" y="355" class="small">X</text>
  <text x="256" y="124" class="small">Y</text>
  <ellipse cx="250" cy="260" rx="48" ry="33" transform="rotate(-12 250 260)" class="contour"/>
  <ellipse cx="250" cy="260" rx="91" ry="62" transform="rotate(-12 250 260)" class="contour" opacity="0.82"/>
  <ellipse cx="250" cy="260" rx="137" ry="94" transform="rotate(-12 250 260)" class="contour" opacity="0.64"/>
  <circle cx="250" cy="260" r="5" fill="#263f50"/>
  <text x="264" y="251" class="body">磁轴固定点</text>
  <text x="326" y="194" class="small">s 增大</text>
  <path d="M320 202 C345 187 361 170 374 150" class="line"/>
  <text x="78" y="421" class="small">线性拟合使磁力线方向导数接近零；独立体点给出误差统计。</text>
  <line x1="445" y1="84" x2="445" y2="430" stroke="#d5dce0"/>
  <text x="475" y="92" class="panel">(b) 连续受支持范围与磁通标定</text>
  <line x1="505" y1="350" x2="820" y2="350" class="axis"/>
  <line x1="505" y1="350" x2="505" y2="125" class="axis"/>
  <text x="822" y="355" class="small">候选层 s</text>
  <text x="488" y="119" class="small">置信度</text>
  <path d="M505 142 C570 143 610 150 655 171 C706 196 750 246 810 330 L810 350 L505 350 Z" fill="url(#confidence)"/>
  <path d="M505 142 C570 143 610 150 655 171 C706 196 750 246 810 330" class="contour"/>
  <line x1="719" y1="155" x2="719" y2="350" class="guide"/>
  <text x="688" y="141" class="body">有效边界</text>
  <text x="527" y="380" class="small">置信度曲线的径向积分给出连续边界；磁通条件可将边界有界地向内修正。</text>
  <path d="M526 302 C575 286 612 267 650 238 C687 211 724 171 786 132" class="line"/>
  <text x="736" y="120" class="body">物理磁通 ψ(s)</text>
  <line x1="866" y1="84" x2="866" y2="430" stroke="#d5dce0"/>
  <text x="896" y="92" class="panel">(c) 直场线坐标中的磁力线</text>
  <line x1="922" y1="350" x2="1240" y2="350" class="axis"/>
  <line x1="922" y1="350" x2="922" y2="125" class="axis"/>
  <text x="1245" y="355" class="small">环向角 φ</text>
  <text x="890" y="119" class="small">修正极角</text>
  <path d="M922 320 L1240 178" class="line"/>
  <path d="M922 276 L1240 134" class="line" opacity="0.75"/>
  <path d="M922 364 L1240 222" class="line" opacity="0.75"/>
  <line x1="1001" y1="125" x2="1001" y2="350" class="guide"/>
  <line x1="1081" y1="125" x2="1081" y2="350" class="guide"/>
  <line x1="1161" y1="125" x2="1161" y2="350" class="guide"/>
  <text x="944" y="395" class="small">联合线性最小二乘确定直场线标记 α 和旋转变换 ι(ρ)。</text>
  <text x="944" y="418" class="small">平行直线表示同一磁面上不同磁力线标签。</text>
</svg>
