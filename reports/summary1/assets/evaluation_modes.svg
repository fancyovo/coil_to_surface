<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="610" viewBox="0 0 1320 610">
  <defs>
    <style>
      .title{font:700 24px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172832}
      .head{font:700 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172832}
      .row{font:700 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172832}
      .body{font:400 14px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#344954}
      .small{font:400 12.5px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#566771}
      .grid{stroke:#cfd7dc;stroke-width:1}
      .formal{fill:#dcebec;stroke:#4f7f82;stroke-width:1.4}
      .local{fill:#fff0df;stroke:#b97933;stroke-width:1.4}
      .reuse{fill:#f0f2f4;stroke:#87949d;stroke-width:1.2}
      .none{fill:#fff;stroke:#c9d1d6;stroke-width:1.2;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="1320" height="610" fill="#fff"/>
  <text x="46" y="43" class="title">三种评估模式的计算依赖与输出口径</text>
  <line x1="46" y1="59" x2="1273" y2="59" stroke="#c9d1d6"/>

  <text x="50" y="105" class="head">模式</text>
  <text x="224" y="94" text-anchor="middle" class="head">磁轴</text>
  <text x="224" y="114" text-anchor="middle" class="small">固定点与拓扑</text>
  <text x="397" y="94" text-anchor="middle" class="head">几何标签 s</text>
  <text x="397" y="114" text-anchor="middle" class="small">线性系统</text>
  <text x="570" y="94" text-anchor="middle" class="head">边界与磁通</text>
  <text x="570" y="114" text-anchor="middle" class="small">连续范围、ψ(s)</text>
  <text x="743" y="94" text-anchor="middle" class="head">直场线坐标</text>
  <text x="743" y="114" text-anchor="middle" class="small">α 与 ι(ρ)</text>
  <text x="916" y="94" text-anchor="middle" class="head">体 QS</text>
  <text x="916" y="114" text-anchor="middle" class="small">QA / QH / QP</text>
  <text x="1089" y="94" text-anchor="middle" class="head">线圈工程量</text>
  <text x="1089" y="114" text-anchor="middle" class="small">长度、曲率、间距</text>
  <text x="1240" y="105" text-anchor="middle" class="head">用途</text>

  <line x1="46" y1="130" x2="1274" y2="130" class="grid"/>
  <line x1="145" y1="74" x2="145" y2="509" class="grid"/>
  <line x1="310" y1="74" x2="310" y2="509" class="grid"/>
  <line x1="483" y1="74" x2="483" y2="509" class="grid"/>
  <line x1="656" y1="74" x2="656" y2="509" class="grid"/>
  <line x1="829" y1="74" x2="829" y2="509" class="grid"/>
  <line x1="1002" y1="74" x2="1002" y2="509" class="grid"/>
  <line x1="1175" y1="74" x2="1175" y2="509" class="grid"/>

  <text x="50" y="181" class="row">独立评估</text>
  <text x="50" y="204" class="small">仅输入线圈</text>
  <rect x="163" y="148" width="129" height="80" rx="2" class="formal"/>
  <text x="227" y="180" text-anchor="middle" class="body">全局网格搜索</text>
  <text x="227" y="204" text-anchor="middle" class="small">候选精修与验收</text>
  <rect x="328" y="148" width="137" height="80" rx="2" class="formal"/>
  <text x="397" y="180" text-anchor="middle" class="body">FP32 QR</text>
  <text x="397" y="204" text-anchor="middle" class="small">48³ 拟合网格</text>
  <rect x="501" y="148" width="137" height="80" rx="2" class="formal"/>
  <text x="570" y="180" text-anchor="middle" class="body">完整重算</text>
  <text x="570" y="204" text-anchor="middle" class="small">连续边界</text>
  <rect x="674" y="148" width="137" height="80" rx="2" class="formal"/>
  <text x="743" y="180" text-anchor="middle" class="body">FP32 QR</text>
  <text x="743" y="204" text-anchor="middle" class="small">联合拟合</text>
  <rect x="847" y="148" width="137" height="80" rx="2" class="formal"/>
  <text x="916" y="180" text-anchor="middle" class="body">完整重算</text>
  <text x="916" y="204" text-anchor="middle" class="small">十万体积点</text>
  <rect x="1020" y="148" width="137" height="80" rx="2" class="formal"/>
  <text x="1089" y="180" text-anchor="middle" class="body">直接计算</text>
  <text x="1089" y="204" text-anchor="middle" class="small">256 段/线圈</text>
  <text x="1191" y="180" class="body">数据集评分</text>
  <text x="1191" y="204" class="small">最终无历史复评</text>

  <line x1="46" y1="247" x2="1274" y2="247" class="grid"/>
  <text x="50" y="298" class="row">严格续接</text>
  <text x="50" y="321" class="small">输入上一正式轴</text>
  <rect x="163" y="265" width="129" height="80" rx="2" class="formal"/>
  <text x="227" y="297" text-anchor="middle" class="body">同分支局部修正</text>
  <text x="227" y="321" text-anchor="middle" class="small">越界即拒绝</text>
  <rect x="328" y="265" width="137" height="80" rx="2" class="formal"/>
  <text x="397" y="297" text-anchor="middle" class="body">FP32 QR</text>
  <text x="397" y="321" text-anchor="middle" class="small">完整重算</text>
  <rect x="501" y="265" width="137" height="80" rx="2" class="formal"/>
  <text x="570" y="297" text-anchor="middle" class="body">完整重算</text>
  <text x="570" y="321" text-anchor="middle" class="small">连续边界</text>
  <rect x="674" y="265" width="137" height="80" rx="2" class="formal"/>
  <text x="743" y="297" text-anchor="middle" class="body">FP32 QR</text>
  <text x="743" y="321" text-anchor="middle" class="small">完整重算</text>
  <rect x="847" y="265" width="137" height="80" rx="2" class="formal"/>
  <text x="916" y="297" text-anchor="middle" class="body">完整重算</text>
  <text x="916" y="321" text-anchor="middle" class="small">十万体积点</text>
  <rect x="1020" y="265" width="137" height="80" rx="2" class="formal"/>
  <text x="1089" y="297" text-anchor="middle" class="body">直接计算</text>
  <text x="1089" y="321" text-anchor="middle" class="small">完整工程量</text>
  <text x="1191" y="297" class="body">优化中心</text>
  <text x="1191" y="321" class="small">正式连续评估</text>

  <line x1="46" y1="364" x2="1274" y2="364" class="grid"/>
  <text x="50" y="415" class="row">近邻批量代理</text>
  <text x="50" y="438" class="small">输入正式中心</text>
  <rect x="163" y="382" width="129" height="80" rx="2" class="local"/>
  <text x="227" y="414" text-anchor="middle" class="body">批量局部精修</text>
  <text x="227" y="438" text-anchor="middle" class="small">固定同一轴分支</text>
  <rect x="328" y="382" width="137" height="80" rx="2" class="local"/>
  <text x="397" y="414" text-anchor="middle" class="body">4 步预条件迭代</text>
  <text x="397" y="438" text-anchor="middle" class="small">中心 QR 作预条件</text>
  <rect x="501" y="382" width="137" height="80" rx="2" class="reuse"/>
  <text x="570" y="414" text-anchor="middle" class="body">固定中心边界层</text>
  <text x="570" y="438" text-anchor="middle" class="small">逐候选重标定磁通</text>
  <rect x="674" y="382" width="137" height="80" rx="2" class="local"/>
  <text x="743" y="414" text-anchor="middle" class="body">4 步预条件迭代</text>
  <text x="743" y="438" text-anchor="middle" class="small">坐标分量继承中心</text>
  <rect x="847" y="382" width="137" height="80" rx="2" class="local"/>
  <text x="916" y="414" text-anchor="middle" class="body">逐候选重算</text>
  <text x="916" y="438" text-anchor="middle" class="small">局部排序代理</text>
  <rect x="1020" y="382" width="137" height="80" rx="2" class="reuse"/>
  <text x="1089" y="414" text-anchor="middle" class="body">中心一阶近似</text>
  <text x="1089" y="438" text-anchor="middle" class="small">原始工程字段缺失</text>
  <text x="1191" y="414" class="body">差分端点</text>
  <text x="1191" y="438" class="small">方向与局部排序</text>

  <line x1="46" y1="509" x2="1274" y2="509" class="grid"/>
  <rect x="50" y="535" width="22" height="16" class="formal"/><text x="82" y="548" class="small">正式重算，可作为独立物理元数据</text>
  <rect x="361" y="535" width="22" height="16" class="local"/><text x="393" y="548" class="small">当前候选重算，但采用近邻迭代近似</text>
  <rect x="704" y="535" width="22" height="16" class="reuse"/><text x="736" y="548" class="small">继承中心或一阶近似</text>
  <text x="50" y="582" class="small">近邻批量代理的适用对象是同一正式中心附近的一批有限差分端点；每个接受后的新中心重新运行严格续接评估。</text>
</svg>
