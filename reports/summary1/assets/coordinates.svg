<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315a78"/></marker>
    <style>
      .title{font:700 27px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#18323f}
      .label{font:700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#18323f}
      .body{font:400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#425a66}
      .math{font:italic 20px Georgia,serif;fill:#18323f}
      .small{font:400 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#526975}
    </style>
  </defs>
  <rect width="1440" height="590" fill="#fbfcfd"/>
  <text x="55" y="54" class="title">几何标签、磁通与直场线坐标不是同一个量</text>
  <g transform="translate(55 90)">
    <rect x="0" y="0" width="620" height="430" rx="12" fill="#eef3f6" stroke="#b7c7d0"/>
    <ellipse cx="300" cy="215" rx="235" ry="160" fill="#dce8ed" stroke="#315a78" stroke-width="2"/>
    <ellipse cx="300" cy="215" rx="185" ry="124" fill="#eaf1f4" stroke="#4d8b6a" stroke-width="2"/>
    <ellipse cx="300" cy="215" rx="128" ry="83" fill="#f6f9fa" stroke="#d17a45" stroke-width="2"/>
    <ellipse cx="300" cy="215" rx="66" ry="39" fill="#ffffff" stroke="#a35f82" stroke-width="2"/>
    <circle cx="300" cy="215" r="7" fill="#18323f"/>
    <text x="316" y="205" class="label">磁轴</text>
    <path d="M300 215 L428 132" stroke="#315a78" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M428 132 A153 105 0 0 1 493 222" stroke="#d17a45" stroke-width="3" fill="none" marker-end="url(#arr)"/>
    <text x="366" y="162" class="math">rho</text>
    <text x="491" y="179" class="math">theta</text>
    <text x="40" y="387" class="small">同一截面上的嵌套等值线；环向角 phi 指向相邻截面。</text>
  </g>
  <g transform="translate(720 92)">
    <rect x="0" y="0" width="655" height="112" rx="9" fill="#fff3e8" stroke="#d17a45" stroke-width="2"/>
    <text x="24" y="35" class="label">1. 几何标签 s</text>
    <text x="24" y="67" class="math">B · grad s = 0,    s = O(r²)</text>
    <text x="24" y="94" class="body">给出近轴嵌套结构，但尺度尚无磁通单位。</text>

    <rect x="0" y="138" width="655" height="112" rx="9" fill="#f6edf3" stroke="#a35f82" stroke-width="2"/>
    <text x="24" y="173" class="label">2. 物理磁通 psi</text>
    <text x="24" y="205" class="math">psi(s) = Phi_t(s) / 2pi,    rho = sqrt(psi / psi_edge)</text>
    <text x="24" y="232" class="body">由截面磁通积分标定，决定体积权重和径向坐标。</text>

    <rect x="0" y="276" width="655" height="140" rx="9" fill="#edf1f7" stroke="#536f9d" stroke-width="2"/>
    <text x="24" y="311" class="label">3. 直场线坐标 alpha 与旋转变换 iota</text>
    <text x="24" y="346" class="math">alpha = theta + lambda - iota(rho) phi</text>
    <text x="24" y="378" class="math">B · grad alpha = 0</text>
    <text x="24" y="405" class="body">一次联合线性拟合得到全体积展开，不是逐面非线性求解。</text>
  </g>
  <text x="720" y="558" text-anchor="middle" class="small">只有完成磁通标定后，微分 QS 公式中的 grad psi 与径向积分才具有一致物理意义。</text>
</svg>
