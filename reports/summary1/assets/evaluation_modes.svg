<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850">
  <defs>
    <style>
      .title{font:700 25px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172832}
      .head{font:700 19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172832}
      .stage{font:700 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263b46}
      .body{font:400 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#344954}
      .small{font:400 13.5px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#566771}
      .header{fill:#f8fafb;stroke:#9aa8b0;stroke-width:1.4}
      .formal{fill:#dcebec;stroke:#4f7f82;stroke-width:1.3}
      .local{fill:#fff0df;stroke:#b97933;stroke-width:1.3}
      .reuse{fill:#f0f2f4;stroke:#87949d;stroke-width:1.2}
      .line{stroke:#cfd7dc;stroke-width:1}
    </style>
  </defs>
  <rect width="1320" height="850" fill="#fff"/>
  <text x="42" y="43" class="title">三种评估模式：哪些量重新计算，哪些信息可以复用</text>
  <line x1="42" y1="60" x2="1278" y2="60" class="line"/>

  <text x="50" y="126" class="head">计算阶段</text>
  <rect x="250" y="82" width="320" height="82" rx="3" class="header"/>
  <text x="410" y="115" text-anchor="middle" class="head">独立评估</text>
  <text x="410" y="141" text-anchor="middle" class="small">输入：线圈与场周期数</text>
  <rect x="595" y="82" width="320" height="82" rx="3" class="header"/>
  <text x="755" y="115" text-anchor="middle" class="head">严格续接评估</text>
  <text x="755" y="141" text-anchor="middle" class="small">输入：线圈与上一正式中心的磁轴</text>
  <rect x="940" y="82" width="320" height="82" rx="3" class="header"/>
  <text x="1100" y="115" text-anchor="middle" class="head">近邻批量代理</text>
  <text x="1100" y="141" text-anchor="middle" class="small">输入：正式中心与一批有限差分端点</text>

  <text x="50" y="220" class="stage">磁轴</text>
  <text x="50" y="244" class="small">固定点与拓扑</text>
  <rect x="250" y="181" width="320" height="78" rx="3" class="formal"/>
  <text x="410" y="214" text-anchor="middle" class="body">全局网格搜索与候选精修</text>
  <text x="410" y="239" text-anchor="middle" class="small">每个样本从全局搜索开始</text>
  <rect x="595" y="181" width="320" height="78" rx="3" class="formal"/>
  <text x="755" y="214" text-anchor="middle" class="body">从上一磁轴作同分支局部修正</text>
  <text x="755" y="239" text-anchor="middle" class="small">位移或拓扑越界即拒绝</text>
  <rect x="940" y="181" width="320" height="78" rx="3" class="local"/>
  <text x="1100" y="214" text-anchor="middle" class="body">从中心磁轴批量局部修正</text>
  <text x="1100" y="239" text-anchor="middle" class="small">仅适用于足够近的端点</text>

  <text x="50" y="306" class="stage">几何标签 s</text>
  <text x="50" y="330" class="small">B · ∇s = 0</text>
  <rect x="250" y="267" width="320" height="78" rx="3" class="formal"/>
  <text x="410" y="300" text-anchor="middle" class="body">构造 48³ 系统并做 FP32 QR</text>
  <text x="410" y="325" text-anchor="middle" class="small">从头求解全部系数</text>
  <rect x="595" y="267" width="320" height="78" rx="3" class="formal"/>
  <text x="755" y="300" text-anchor="middle" class="body">构造 48³ 系统并做 FP32 QR</text>
  <text x="755" y="325" text-anchor="middle" class="small">从头求解全部系数</text>
  <rect x="940" y="267" width="320" height="78" rx="3" class="local"/>
  <text x="1100" y="300" text-anchor="middle" class="body">中心 QR 因子作预条件</text>
  <text x="1100" y="325" text-anchor="middle" class="small">每个端点固定迭代 4 步</text>

  <text x="50" y="397" class="stage">边界与磁通</text>
  <text x="50" y="421" class="small">受支持范围、ψ(s)</text>
  <rect x="250" y="353" width="320" height="88" rx="3" class="formal"/>
  <text x="410" y="389" text-anchor="middle" class="body">追踪候选层并确定连续边界</text>
  <text x="410" y="416" text-anchor="middle" class="small">在该边界内重新标定磁通</text>
  <rect x="595" y="353" width="320" height="88" rx="3" class="formal"/>
  <text x="755" y="389" text-anchor="middle" class="body">追踪候选层并确定连续边界</text>
  <text x="755" y="416" text-anchor="middle" class="small">在该边界内重新标定磁通</text>
  <rect x="940" y="353" width="320" height="88" rx="3" class="local"/>
  <text x="1100" y="389" text-anchor="middle" class="body">固定中心的标签值 s_edge</text>
  <text x="1100" y="416" text-anchor="middle" class="small">候选用自己的 s(x) 重求等值线与磁通</text>

  <text x="50" y="494" class="stage">直场线坐标</text>
  <text x="50" y="518" class="small">α、ι(ρ) 与体 QS</text>
  <rect x="250" y="449" width="320" height="94" rx="3" class="formal"/>
  <text x="410" y="486" text-anchor="middle" class="body">联合 QR 求解 α 与 ι(ρ)</text>
  <text x="410" y="514" text-anchor="middle" class="small">在十万体积点上计算 QA/QH/QP</text>
  <rect x="595" y="449" width="320" height="94" rx="3" class="formal"/>
  <text x="755" y="486" text-anchor="middle" class="body">联合 QR 求解 α 与 ι(ρ)</text>
  <text x="755" y="514" text-anchor="middle" class="small">在十万体积点上计算 QA/QH/QP</text>
  <rect x="940" y="449" width="320" height="94" rx="3" class="local"/>
  <text x="1100" y="486" text-anchor="middle" class="body">中心 QR 因子作预条件</text>
  <text x="1100" y="514" text-anchor="middle" class="small">固定迭代 4 步，再逐端点重算体 QS</text>

  <text x="50" y="589" class="stage">线圈工程量</text>
  <text x="50" y="613" class="small">长度、曲率、间距等</text>
  <rect x="250" y="551" width="320" height="78" rx="3" class="formal"/>
  <text x="410" y="585" text-anchor="middle" class="body">由当前线圈直接计算</text>
  <text x="410" y="610" text-anchor="middle" class="small">返回完整原始量</text>
  <rect x="595" y="551" width="320" height="78" rx="3" class="formal"/>
  <text x="755" y="585" text-anchor="middle" class="body">由当前线圈直接计算</text>
  <text x="755" y="610" text-anchor="middle" class="small">返回完整原始量</text>
  <rect x="940" y="551" width="320" height="78" rx="3" class="reuse"/>
  <text x="1100" y="585" text-anchor="middle" class="body">中心处一阶 Taylor 展开</text>
  <text x="1100" y="610" text-anchor="middle" class="small">局部误差标定见第 4.5 节</text>

  <text x="50" y="692" class="stage">结果用途</text>
  <rect x="250" y="645" width="320" height="96" rx="3" class="formal"/>
  <text x="410" y="683" text-anchor="middle" class="body">数据集评分、起点筛选</text>
  <text x="410" y="711" text-anchor="middle" class="small">以及最终无历史复评</text>
  <rect x="595" y="645" width="320" height="96" rx="3" class="formal"/>
  <text x="755" y="683" text-anchor="middle" class="body">优化中心的正式分数</text>
  <text x="755" y="711" text-anchor="middle" class="small">接受后成为下一批端点的锚点</text>
  <rect x="940" y="645" width="320" height="96" rx="3" class="reuse"/>
  <text x="1100" y="683" text-anchor="middle" class="body">有限差分方向与局部排序</text>
  <text x="1100" y="711" text-anchor="middle" class="small">新中心由严格续接正式重算</text>

  <rect x="50" y="784" width="22" height="16" class="formal"/>
  <text x="82" y="797" class="small">正式重算</text>
  <rect x="222" y="784" width="22" height="16" class="local"/>
  <text x="254" y="797" class="small">当前端点重算，但使用中心信息加速</text>
  <rect x="576" y="784" width="22" height="16" class="reuse"/>
  <text x="608" y="797" class="small">继承中心或使用局部近似</text>
</svg>
